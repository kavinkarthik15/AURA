name: quality

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Format check
        run: black --check backend/ai backend/services backend/tests
      - name: Lint
        run: ruff check backend/ai backend/services backend/tests
      - name: Type check
        run: mypy backend/ai backend/services backend/tests
      - name: Tests with coverage
        run: pytest --cov=backend --cov-report=term-missing backend/tests
